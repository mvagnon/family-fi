services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: family_fi
      POSTGRES_USER: family_fi
      POSTGRES_PASSWORD: family_fi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_fi -d family_fi"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    command: ["bun", "run", "--filter=api", "prisma:deploy"]
    environment:
      DATABASE_URL: postgresql://family_fi:family_fi@db:5432/family_fi
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://family_fi:family_fi@db:5432/family_fi
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000
    environment:
      HOST: 0.0.0.0
      PORT: "5173"
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
