services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_fi}
      POSTGRES_USER: ${POSTGRES_USER:-family_fi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family_fi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    command: ["bun", "run", "--filter=api", "prisma:deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-family_fi}:${POSTGRES_PASSWORD:-family_fi}@db:5432/${POSTGRES_DB:-family_fi}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    command:
      [
        "sh",
        "-lc",
        "cd /app && bun install --frozen-lockfile && cd /app/apps/api && bun run prisma generate && bun --watch src/index.ts",
      ]
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-only-better-auth-secret-32-chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
      DATABASE_URL: postgresql://${POSTGRES_USER:-family_fi}:${POSTGRES_PASSWORD:-family_fi}@db:5432/${POSTGRES_DB:-family_fi}
      HUB_ORIGIN: ${HUB_ORIGIN:-http://localhost:5173}
      IKI_AUTH_BROWSER_ORIGIN: ${IKI_AUTH_BROWSER_ORIGIN:-http://localhost:3000}
      IKI_AUTH_SERVER_ORIGIN: ${IKI_AUTH_SERVER_ORIGIN:-http://host.docker.internal:3000}
      IKI_OAUTH_CLIENT_ID: ${IKI_OAUTH_CLIENT_ID:-family-fi}
      IKI_OAUTH_CLIENT_SECRET: ${IKI_OAUTH_CLIENT_SECRET:-development-only-family-fi-oauth-secret}
      PORT: "${API_PORT:-3001}"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5174}
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
      - api-node-modules:/app/apps/api/node_modules
      - api-generated-prisma:/app/apps/api/src/generated/prisma
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
        VITE_LOGIN_FALLBACK_URL: ${VITE_LOGIN_FALLBACK_URL:-http://localhost:5173/login?app=family-fi}
    command:
      [
        "sh",
        "-lc",
        "cd /app && bun install --frozen-lockfile && cd /app/apps/web && bun run react-router dev --host ${WEB_HOST:-0.0.0.0} --port ${WEB_PORT:-5174}",
      ]
    environment:
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
      HOST: ${WEB_HOST:-0.0.0.0}
      PORT: "${WEB_PORT:-5174}"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
      VITE_HUB_API_BASE_URL: ${VITE_HUB_API_BASE_URL:-http://localhost:3000}
      VITE_LOGIN_FALLBACK_URL: "${VITE_LOGIN_FALLBACK_URL:-http://localhost:5173/login?app=family-fi}"
    ports:
      - "${WEB_PORT:-5174}:${WEB_PORT:-5174}"
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
      - web-node-modules:/app/apps/web/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  api-generated-prisma:
  api-node-modules:
  postgres-data:
  root-node-modules:
  web-node-modules:
