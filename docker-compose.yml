services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    command: ["bun", "run", "--filter=api", "prisma:deploy"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    command:
      [
        "sh",
        "-lc",
        "cd /app && bun install --frozen-lockfile && cd /app/apps/api && bun run prisma generate && bun --watch src/index.ts",
      ]
    env_file:
      - .env
    environment:
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      IKI_OAUTH_CLIENT_SECRET: "${IKI_OAUTH_CLIENT_SECRET:?IKI_OAUTH_CLIENT_SECRET is required}"
      NODE_ENV: development
      PORT: "${API_PORT:?API_PORT is required}"
    ports:
      - "${API_PORT:?API_PORT is required}:${API_PORT:?API_PORT is required}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
      - api-node-modules:/app/apps/api/node_modules
      - api-generated-prisma:/app/apps/api/src/generated/prisma
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}"
    command:
      [
        "sh",
        "-lc",
        "cd /app && bun install --frozen-lockfile && cd /app/apps/web && bun run react-router dev --host ${WEB_HOST:?WEB_HOST is required} --port ${WEB_PORT:?WEB_PORT is required}",
      ]
    env_file:
      - .env
    environment:
      HOST: "${WEB_HOST:?WEB_HOST is required}"
      PORT: "${WEB_PORT:?WEB_PORT is required}"
    ports:
      - "${WEB_PORT:?WEB_PORT is required}:${WEB_PORT:?WEB_PORT is required}"
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
      - web-node-modules:/app/apps/web/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  api-generated-prisma:
  api-node-modules:
  postgres-data:
  root-node-modules:
  web-node-modules:
